<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>부서 회계장부</title>
<style>
:root{
  --ink:#1c2333; --ink2:#4a5468; --mute:#8792a8;
  --line:#e2e5ec; --line2:#eef0f5;
  --paper:#ffffff; --bg:#f4f2ee;
  --accent:#2f5d50; --accent-l:#e8f0ed;
  --in:#1d6b4f; --in-bg:#e9f5ef;
  --out:#b03a3a; --out-bg:#fcecec;
  --warn:#a76b19; --warn-bg:#fdf3e2;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
  font-size:14px; line-height:1.55; -webkit-text-size-adjust:100%;
}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 80px}
header{background:var(--accent);color:#fff;padding:14px 0 0}
header .wrap{padding-bottom:0}
.hd{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding-bottom:12px}
.hd h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.02em}
.hd .sub{font-size:12.5px;opacity:.82}
.hd .st{margin-left:auto;font-size:12px;opacity:.8}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{
  background:transparent;border:0;color:#fff;opacity:.72;cursor:pointer;
  padding:9px 15px;font-size:13.5px;font-family:inherit;white-space:nowrap;
  border-radius:8px 8px 0 0;font-weight:600;
}
nav button:hover{opacity:1;background:rgba(255,255,255,.1)}
nav button.on{opacity:1;background:var(--bg);color:var(--accent)}
.navr{margin-left:auto;display:flex;align-items:center;gap:6px;padding:0 0 6px 10px;flex-shrink:0}
.navr label{font-size:11.5px;opacity:.85;white-space:nowrap}
.navr select{width:auto;min-width:118px;padding:4px 8px;border:0;border-radius:6px;font-size:12.5px}
.navr button{padding:5px 12px;border-radius:6px;background:rgba(255,255,255,.18);opacity:1;font-size:12.5px}
.navr button:hover{background:rgba(255,255,255,.32)}
.robar{background:var(--warn-bg);border:1px solid #f0dcb8;color:#7a4f13;border-radius:var(--r);
  padding:10px 14px;margin-bottom:14px;font-size:13px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
tr.hl td{background:#fff4c9!important;transition:background 1.6s}
main{padding-top:20px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.card>h2{margin:0 0 4px;font-size:16px;letter-spacing:-.01em}
.card>h2+.hint{margin-top:0}
.hint{color:var(--mute);font-size:12.5px;margin:0 0 14px}
.row{display:flex;gap:16px;flex-wrap:wrap}
.col{flex:1;min-width:290px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:middle}
th{background:#f8f9fb;font-weight:600;color:var(--ink2);font-size:12px;border-bottom:1px solid var(--line);white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.c,th.c{text-align:center}
tr.tot td{font-weight:700;background:#f8f9fb;border-top:1.5px solid var(--ink2);border-bottom:1.5px solid var(--ink2)}
tr.sub td{font-weight:600;background:#fbfbfd}
.in{color:var(--in)} .out{color:var(--out)}
input,select,textarea,button{font-family:inherit;font-size:13px}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-l);border-color:var(--accent)}
input.n{text-align:right;font-variant-numeric:tabular-nums}
.btn{background:var(--accent);color:#fff;border:0;border-radius:7px;padding:7px 14px;cursor:pointer;font-weight:600}
.btn:hover{filter:brightness(1.1)}
.btn.g{background:#fff;color:var(--ink2);border:1px solid var(--line)}
.btn.g:hover{background:#f3f4f7;filter:none}
.btn.sm{padding:3px 9px;font-size:12px;border-radius:6px}
.btn.dg{background:#fff;color:var(--out);border:1px solid #f0d6d6}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tools .sp{margin-left:auto}
.badge{display:inline-block;padding:1px 7px;border-radius:20px;font-size:11.5px;font-weight:600}
.b-in{background:var(--in-bg);color:var(--in)} .b-out{background:var(--out-bg);color:var(--out)}
.b-ok{background:var(--in-bg);color:var(--in)} .b-no{background:var(--out-bg);color:var(--out)}
.b-w{background:var(--warn-bg);color:var(--warn)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px dashed var(--line)}
.kv b{font-variant-numeric:tabular-nums}
.big{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.note{background:var(--accent-l);border-left:3px solid var(--accent);padding:10px 13px;border-radius:0 8px 8px 0;font-size:12.5px;color:#26493f;margin-bottom:14px}
.note.w{background:var(--warn-bg);border-color:var(--warn);color:#7a4f13}
ol.steps{padding-left:18px;margin:0;font-size:13.2px}
ol.steps li{margin-bottom:7px}
ol.steps small{color:var(--mute);display:block}
.form{background:#fafbfc;border:1px solid var(--line);padding:12px;border-radius:9px;margin-bottom:14px;
  display:flex;flex-direction:column;gap:9px}
.fr{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fi{display:flex;align-items:center;gap:7px;flex:1 1 150px}
.fi label{font-size:12.5px;color:var(--ink2);font-weight:600;white-space:nowrap;margin:0;flex:none}
.fi.wide{flex:1 1 100%}
.fi.narrow{flex:0 0 auto}
.fi.narrow select{width:82px}
@media(max-width:560px){ .fi{flex:1 1 100%} }
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:3px 12px;font-size:12px;cursor:pointer;color:var(--ink2)}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.scroll{max-height:560px;overflow:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line2);border-radius:8px}
.scroll table{font-size:12.5px}
.scroll thead th{position:sticky;top:0;z-index:1}
.swipe{display:none;font-size:11.5px;color:var(--mute);margin:6px 0 0}

@media screen and (max-width:760px){
  .swipe{display:block}
  .card{overflow-x:auto}
  table.lg{min-width:730px}          /* 출납부 — 항목 칸을 넉넉히 */
  table.wt{min-width:560px}          /* 예산·결산·새해예산요구 */
  .navr select{min-width:96px}
}
.sign{display:flex;gap:26px;justify-content:flex-end;margin-top:26px;font-size:12.5px;color:var(--ink2)}
.sign div{border-top:1px solid var(--ink2);padding-top:5px;min-width:110px;text-align:center}
.print-only{display:none}
.phead{text-align:center}
.ph-c{font-size:12px;color:var(--mute)}
.ph-t{font-size:19px;font-weight:700;margin:2px 0}
.ph-s{font-size:12px;color:var(--mute)}

@page{ size:A4 portrait; margin:12mm 10mm }
@media print{
  html,body{background:#fff;color:#000}
  body{font-size:9.5pt;line-height:1.35}
  header,nav,.tools,.form,.chips,.no-print,input[type=file]{display:none!important}
  .print-only{display:block!important}
  .wrap{max-width:none;width:100%;padding:0;margin:0}
  main{padding-top:0}
  .card{border:0;border-radius:0;padding:0;margin:0 0 7mm;background:none}
  .row{display:block}
  .col{width:100%!important;min-width:0!important;flex:none!important;margin:0 0 6mm}
  .scroll{max-height:none;overflow:visible;border:0;border-radius:0}
  table{width:100%;max-width:100%;font-size:9pt;border-collapse:collapse}
  table.lg,table.wt{min-width:0!important}
  .card{overflow:visible!important}
  .swipe{display:none!important}
  .scroll table{font-size:8.6pt}
  th,td{padding:2px 4px;word-break:break-word;border-bottom:.4pt solid #bbb}
  th{background:#eee!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;font-size:8.4pt}
  thead{display:table-header-group}
  tr{break-inside:avoid;page-break-inside:avoid}
  tr.tot td,tr.sub td{background:#f0f0f0!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .card>h2{font-size:11pt;margin:0 0 3px;border-bottom:.6pt solid #666;padding-bottom:2px}
  .hint{font-size:8pt;margin-bottom:4px}
  input,select,textarea{border:0!important;padding:0 2px!important;background:transparent!important;
    font-size:9pt;color:#000;box-shadow:none!important;-webkit-appearance:none;appearance:none}
  textarea{resize:none;height:auto;min-height:16mm}
  .badge{background:transparent!important;color:#000!important;padding:0;font-weight:600;border:0}
  .big{font-size:12pt}
  .note{background:#f4f4f4!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;
    border-left:1.5pt solid #666;color:#000;font-size:8.2pt;padding:5px 8px}
  .kv{padding:2px 0;font-size:9pt}
  .phead{margin-bottom:5mm;break-after:avoid}
  .ph-t{font-size:14pt} .ph-c,.ph-s{font-size:8.5pt;color:#444}
  .sign{margin-top:8mm;break-inside:avoid;font-size:9pt;color:#000}
  .sign div{border-top:.6pt solid #000}
  ol.steps{font-size:8.6pt}
}
</style>

<header>
  <div class="wrap">
    <div class="hd">

    <nav id="nav"></nav>
  </div>
</header>
<main class="wrap" id="view"></main>

      if(pen<bestP){ bestP=pen; best=g2; bestK=k2; }
    }
    return best;
  }
  return {build:build};
})();

function parseFile(text){                            // 옛 형식(원본 그대로)도 받아들인다
  const o = JSON.parse(text);
  if(o && o.data && o.data.meta) return {name:o.name||o.data.meta.dept||'부서', year:o.year||o.data.meta.year, at:o.at||0, data:o.data};
  if(o && o.meta) return {name:o.meta.dept||'부서', year:o.meta.year, at:0, data:o};
  throw new Error('형식이 다릅니다');
}
function libKey(r){ return `${r.name}_${r.year}` }
async function saveLib(){ try{ await store.set(LIBKEY, JSON.stringify(LIB)) }catch(e){} }
function addToLib(text){
  const r = parseFile(text), k = libKey(r);
  if(!LIB[k] || (r.at||0) >= (LIB[k].at||0)) LIB[k] = r;   // 같은 부서면 최신 것만 남긴다
  return r;
}
function openMyFile(file){

    }catch(e){ alert('회계장부 파일이 아닙니다.') } };
  rd.readAsText(file);
}
function openDeptFiles(files){
  let ok=0, fail=0, left=files.length;
  if(!left) return;
  Array.prototype.forEach.call(files, f=>{
    const rd=new FileReader();
    rd.onload=()=>{ try{ addToLib(rd.result); ok++ }catch(e){ fail++ } done() };
    rd.onerror=()=>{ fail++; done() };
    rd.readAsText(f);
  });
  function done(){
    if(--left) return;
    saveLib();
    srvMsg = `부서 파일 ${ok}개를 읽었습니다.` + (fail?` (${fail}개는 형식이 달라 건너뜀)`:'');
    render();
  }
}

/* ───────── 계산 ───────── */
const won = n => (Math.round(+n||0)).toLocaleString('ko-KR');
const sgn = e => e.type==='수입' ? +e.amount : -e.amount;
function ents(k){ return S.entries[k]||[] }
function sorted(k){
  const a = ents(k).map((e,i)=>({e,i}));
  if(sortDate) a.sort((x,y)=>{
    const dx=x.e.date||'9999', dy=y.e.date||'9999';
    return dx<dy?-1:dx>dy?1:x.i-y.i;
  });
  return a.map(x=>x.e);
}
function net(k){ return ents(k).reduce((s,e)=>s+sgn(e),0) }
function opening(k){
  if(k==='DEC') return +S.openingBalance||0;
  const i = P.findIndex(p=>p.k===k);
  return closing(P[i-1].k);
}
function closing(k){ return opening(k)+net(k) }
/* 원본 엑셀 SUMIF와 동일하게 부호를 살려 합산한다(환불·반환 처리).
   수입 항목은 그대로, 지출 항목은 부호를 뒤집어 양수로 표시한다. */
function catSum(k,cat){ return ents(k).filter(e=>e.cat===cat).reduce((s,e)=>s+sgn(e),0) }
function cumSum(uptoK,cat){
  const idx = QK.indexOf(uptoK);
  return QK.slice(0, idx<0?4:idx+1).reduce((s,q)=>s+catSum(q,cat),0);
}
function catAmt(k,it,isExp){ const v=catSum(k,it); return isExp? -v : v }
function cumAmt(k,it,isExp){ const v=cumSum(k,it); return isExp? -v : v }
function settle(){
  const carry = closing('DEC');
  const inc = S.incomeItems.map((it,i)=>({
    name:it.name, budget:it.budget,
    actual: i===0 ? carry : cumSum('Q4',it.name)
  }));
  const exp = S.expenseItems.map(it=>({name:it.name,budget:it.budget,actual:-cumSum('Q4',it.name)}));
  const incT = inc.reduce((s,x)=>s+x.actual,0);
  const expT = exp.reduce((s,x)=>s+x.actual,0);
  const incB = inc.reduce((s,x)=>s+x.budget,0);
  const expB = exp.reduce((s,x)=>s+x.budget,0);
  return {carry,inc,exp,incT,expT,incB,expB, dec:incT-expT, next:0, q4:closing('Q4')};
}
function knownCats(){ return new Set([...S.incomeItems, ...S.expenseItems].map(i=>i.name)) }
function orphanCount(){
  const K=knownCats(); let n=0;
  P.forEach(p=>ents(p.k).forEach(e=>{ if(!K.has(e.cat)) n++ }));
  return n;
}

function itemPanel(k){
  const isQ = k!=='DEC';
  const r = (arr,cls,ex)=>arr.map(it=>{
    const s=catAmt(k,it.name,ex), c=isQ?cumAmt(k,it.name,ex):null;
    return `<tr><td>${esc(it.name)}</td><td class="n ${s?cls:''}">${s?won(s):'-'}</td>${isQ?`<td class="n">${c?won(c):'-'}</td>`:''}</tr>`;
  }).join('');
  const si=S.incomeItems.slice(1).reduce((s,i)=>s+catAmt(k,i.name,false),0);
  const se=S.expenseItems.reduce((s,i)=>s+catAmt(k,i.name,true),0);
  return `<div class="card" style="margin-top:16px">
    <h2 style="font-size:14px">항목별 소계</h2>
    <table><thead><tr><th>수입</th><th class="n">소계</th>${isQ?'<th class="n">누계</th>':''}</tr></thead><tbody>
    ${r(S.incomeItems.slice(1),'in',false)}
    <tr class="sub"><td>계</td><td class="n">${won(si)}</td>${isQ?`<td class="n">${won(S.incomeItems.slice(1).reduce((s,i)=>s+cumAmt(k,i.name,false),0))}</td>`:''}</tr>
    </tbody></table>
    <table style="margin-top:12px"><thead><tr><th>지출</th><th class="n">소계</th>${isQ?'<th class="n">누계</th>':''}</tr></thead><tbody>
    ${r(S.expenseItems,'out',true)}
    <tr class="sub"><td>계</td><td class="n">${won(se)}</td>${isQ?`<td class="n">${won(S.expenseItems.reduce((s,i)=>s+cumAmt(k,i.name,true),0))}</td>`:''}</tr>
    </tbody></table></div>`;
}
function defDate(p){
  const y = p.k==='DEC' ? S.meta.year-1 : S.meta.year;
  const last = ents(p.k).slice(-1)[0];
  if(last&&last.date) return last.date;
  return `${y}-${String(p.m[0]).padStart(2,'0')}-01`;
}

/* 수입 계획 본문 — 새로 추가한 항목은 '기타' 항목 바로 위에 놓는다 */
function etcIndex(items){
  for(let i=items.length-1;i>=0;i--) if(/^기타/.test(String(items[i].name).trim())) return i;
  return -1;
}
function incBody(s, nI, xI){

      <td>${esc(it.name)}</td><td class="n">${won(s.inc[i].actual)}</td>
      <td class="n"><input type="text" class="n" data-ny="i" data-key="${esc(it.name)}" value="${v?won(v):''}"></td>
      <td class="n ${v-s.inc[i].actual<0?'out':''}">${won(v-s.inc[i].actual)}</td>
      <td class="hint">${i===0?'전년도 이월금':/교회보조|보조금/.test(it.name)?'교회 보조 요구 금액':''}</td>
      <td class="no-print no-ro"></td></tr>`});
  const extra = xI.map((x,i)=>`<tr>
      <td><input type="text" data-xi="${i}" data-f="name" value="${esc(x.name)}" placeholder="새 수입 항목"></td>
      <td class="n">-</td>
      <td class="n"><input type="text" class="n" data-xi="${i}" data-f="amt" value="${x.amt?won(x.amt):''}"></td>

      <td class="c no-print no-ro"><button class="btn dg sm" data-xi-del="${i}">×</button></td></tr>`);

}

/* ───────── 이벤트 ───────── */
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])) }
function num(v){ const n=parseInt(String(v).replace(/[^0-9-]/g,''),10); return isNaN(n)?0:n }
function $(s){ return document.querySelector(s) }
function on(sel,ev,fn){ document.querySelectorAll(sel).forEach(el=>el.addEventListener(ev,fn)) }

/* ───────── 공유 QR ───────── */
function qrMatrix(){
  const u=(S.meta.url||'').trim();
  if(!u) return null;
  try{ return QR.build(u) }catch(e){ return 'ERR' }
}
function drawQR(){
  const box=document.getElementById('qrBox'); if(!box) return;
  const m=qrMatrix();
  if(!m){ box.innerHTML='<div class="hint" style="padding:22px 0">주소를 입력하면 QR이 나타납니다.</div>'; return }
  if(m==='ERR'){ box.innerHTML='<div class="hint" style="padding:22px 0">주소가 너무 길어 QR을 만들 수 없습니다.</div>'; return }
  const n=m.length, q=4, t=n+q*2, px=Math.max(3, Math.floor(190/t));
  let d='';
  for(let y=0;y<n;y++) for(let x=0;x<n;x++) if(m[y][x]) d+=`M${x+q} ${y+q}h1v1h-1z`;
  box.innerHTML = `<svg width="${t*px}" height="${t*px}" viewBox="0 0 ${t} ${t}"
      xmlns="http://www.w3.org/2000/svg" style="background:#fff;border:1px solid var(--line);border-radius:6px">
      <path d="${d}" fill="#111"/></svg>
    <div class="hint" style="margin:6px 0 0;word-break:break-all">${esc(S.meta.url)}</div>`;
}
function qrCanvas(){
  const m=qrMatrix();
  if(!m || m==='ERR') return null;
  const url=(S.meta.url||'').trim();
  const n=m.length, q=4, px=10, qw=(n+q*2)*px, pad=28;
  const W=Math.max(qw+pad*2, 400);
  const title=`${S.meta.year}년 ${deptName()||'부서'} 회계장부`;
  const mc=document.createElement('canvas').getContext('2d');
  mc.font='600 16px sans-serif';
  const maxW=W-pad*2, lines=[]; let cur='';
  for(const ch of url){
    if(mc.measureText(cur+ch).width>maxW && cur){ lines.push(cur); cur=ch }
    else cur+=ch;
  }
  if(cur) lines.push(cur);
  const H = pad + 30 + qw + 18 + lines.length*22 + 16 + pad;
  const c=document.createElement('canvas'); c.width=W; c.height=H;
  const g=c.getContext('2d');
  g.fillStyle='#fff'; g.fillRect(0,0,W,H);
  g.textAlign='center';
  g.fillStyle='#1c2333'; g.font='700 20px sans-serif';
  g.fillText(title, W/2, pad+20);
  const ox=(W-qw)/2, oy=pad+30;
  g.fillStyle='#111';
  for(let y=0;y<n;y++) for(let x=0;x<n;x++) if(m[y][x]) g.fillRect(ox+(x+q)*px, oy+(y+q)*px, px, px);
  g.fillStyle='#2f5d50'; g.font='600 16px sans-serif';
  lines.forEach((ln,i)=>g.fillText(ln, W/2, oy+qw+34+i*22));
  g.fillStyle='#8792a8'; g.font='13px sans-serif';
  g.fillText(`QR을 찍거나 위 주소로 접속하세요 · 버전 ${APPVER}`, W/2, H-pad+2);
  return c;
}
function savePNG(){
  const c=qrCanvas();
  if(!c){ alert('먼저 올바른 주소를 입력하세요.'); return }
  c.toBlob(b=>dl(b, `${deptName()||'부서'}_회계장부_QR.png`));
}

function copyText(t, msg){
  const ok=()=>{ srvMsg=msg; render() };
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(ok, fallback); return }
  }catch(e){}
  fallback();
  function fallback(){
    try{
      const ta=document.createElement('textarea');
      ta.value=t; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta); ok();
    }catch(e){ alert(t) }
  }
}
async function shareQR(){
  const c=qrCanvas();
  if(!c){ alert('먼저 올바른 주소를 입력하세요.'); return }
  c.toBlob(async b=>{
    const f=new File([b], `회계장부_QR.png`, {type:'image/png'});
    try{
      if(navigator.canShare && navigator.canShare({files:[f]}))
        await navigator.share({files:[f], text:shareMsg()});
      else await navigator.share({text:shareMsg(), url:(S.meta.url||'').trim()});
    }catch(e){}
  });
}

function bind(){
  on('[data-meta]','change',e=>{ const f=e.target.dataset.meta;
    S.meta[f] = f==='year'? (parseInt(e.target.value)||S.meta.year) : e.target.value;
    save(); if(f==='url'){ drawQR() } else { render() } });
  on('[data-meta="url"]','input',()=>{ S.meta.url=$('[data-meta=\"url\"]').value; drawQR() });
  on('[data-open]','change',e=>{ S.openingBalance=num(e.target.value); save(); render() });

  on('[data-bi]','change',e=>{ const i=+e.target.dataset.bi,f=e.target.dataset.f;
    if(f==='budget') S.incomeItems[i].budget=num(e.target.value);
    else { const old=S.incomeItems[i].name, nv=e.target.value.trim(); renameCat(old,nv); S.incomeItems[i].name=nv }
    save(); render() });
  on('[data-be]','change',e=>{ const i=+e.target.dataset.be,f=e.target.dataset.f;
    if(f==='budget') S.expenseItems[i].budget=num(e.target.value);
    else if(f==='basis') S.expenseItems[i].basis=e.target.value;
    else { const old=S.expenseItems[i].name, nv=e.target.value.trim(); renameCat(old,nv); S.expenseItems[i].name=nv }
    save(); render() });
  on('[data-add-inc]','click',()=>{ S.incomeItems.push({name:'새 수입항목',budget:0}); save(); render() });
  on('[data-add-exp]','click',()=>{ S.expenseItems.push({name:(S.expenseItems.length+1)+'.새 지출항목',budget:0,basis:''}); save(); render() });
  on('[data-del-inc]','click',e=>{ const i=+e.target.dataset.delInc;
    if(used(S.incomeItems[i].name) && !confirm('이 항목으로 기록된 거래가 있습니다. 그래도 삭제할까요?')) return;
    S.incomeItems.splice(i,1); save(); render() });
  on('[data-del-exp]','click',e=>{ const i=+e.target.dataset.delExp;
    if(used(S.expenseItems[i].name) && !confirm('이 항목으로 기록된 거래가 있습니다. 그래도 삭제할까요?')) return;
    S.expenseItems.splice(i,1); save(); render() });

  on('[data-per]','click',e=>{ per=e.target.dataset.per; mfil=0; editId=null; render() });
  on('[data-mf]','click',e=>{ mfil=+e.target.dataset.mf; render() });
  if($('#tgSort')) $('#tgSort').onclick=()=>{ sortDate=!sortDate; render() };
  on('[data-rm]','click',e=>{ const id=e.target.dataset.rm;
    if(!confirm('이 거래를 삭제할까요?')) return;
    S.entries[per]=ents(per).filter(x=>x.id!==id); if(editId===id) editId=null; save(); render() });
  on('[data-ed]','click',e=>{ editId=e.target.dataset.ed; render();
    const el=$('#fAmt'); if(el) el.focus() });

  const ft=$('#fType');
  if(ft){
    const fill=()=>{
      const list = ft.value==='수입'? S.incomeItems : S.expenseItems;
      const cur = editId ? (ents(per).find(x=>x.id===editId)||{}).cat : null;
      $('#fCat').innerHTML = list.length
        ? list.map(i=>`<option ${i.name===cur?'selected':''}>${esc(i.name)}</option>`).join('')
        : '<option value="">예산 탭에서 항목을 먼저 등록하세요</option>';
    };
    ft.onchange=fill; fill();
    const add=()=>{
      const amt=num($('#fAmt').value), cat=$('#fCat').value;
      if(!cat){ alert('예산 탭에서 항목을 먼저 등록하세요.'); return }
      if(!amt){ $('#fAmt').focus(); return }
      const rec={type:ft.value,cat,date:$('#fDate').value,amount:Math.abs(amt),note:$('#fNote').value.trim()};
      if(editId){ const i=ents(per).findIndex(x=>x.id===editId); S.entries[per][i]=Object.assign({id:editId},rec); lastAdd=editId; editId=null }
      else { const id=uid(); S.entries[per].push(Object.assign({id},rec)); lastAdd=id }
      const mo = rec.date? +rec.date.slice(5,7) : 0;      // 걸러져 안 보이면 필터 해제
      if(mfil && mo!==mfil) mfil=0;
      save(); render();
      const a=$('#fAmt'); if(a) a.focus();
    };
    $('#fAdd').onclick=add;
    ['fAmt','fNote'].forEach(id=>{ const el=$('#'+id); if(el) el.onkeydown=ev=>{ if(ev.key==='Enter') add() } });
    if($('#fCancel')) $('#fCancel').onclick=()=>{ editId=null; render() };
  }

  on('[data-ny]','change',e=>{ const t=e.target.dataset.ny, k=e.target.dataset.key;
    if(t==='e') S.nextYear.expense[k]=num(e.target.value);
    else if(t==='i') S.nextYear.income[k]=num(e.target.value);
    else if(t==='b') S.nextYear.basis[k]=e.target.value;
    else S.nextYear.note=e.target.value;
    save(); if(t!=='b'&&t!=='n') render() });
  if($('#copyPrev')) $('#copyPrev').onclick=()=>{
    const s=settle();
    S.expenseItems.forEach((it,i)=>S.nextYear.expense[it.name]=s.exp[i].actual);
    S.incomeItems.forEach((it,i)=>S.nextYear.income[it.name]=s.inc[i].actual);
    save(); render();
  };

  on('[data-srv]','click',e=>{
    if(e.target.dataset.srv==='save') saveFile();
    else document.getElementById('myFile').click();
  });
  drawQR();
  if($('#qrHere')) $('#qrHere').onclick=()=>{
    let u='';
    try{ u=String(location.href).split('#')[0] }catch(e){}
    if(!/^https?:\/\//.test(u)){ alert('이 화면의 주소를 읽을 수 없습니다. 주소창의 주소를 직접 붙여넣어 주세요.'); return }
    S.meta.url=u; save(); render();
  };
  if($('#qrPng')) $('#qrPng').onclick=()=>savePNG();
  if($('#qrMsg')) $('#qrMsg').onclick=()=>{
    if(!(S.meta.url||'').trim()){ alert('먼저 주소를 입력하세요.'); return }
    copyText(shareMsg(), '안내문을 복사했습니다. 카톡에 붙여넣으세요.');
  };
  if($('#qrCopy')) $('#qrCopy').onclick=()=>{
    const u=(S.meta.url||'').trim();
    if(!u){ alert('먼저 주소를 입력하세요.'); return }
    copyText(u, '주소를 복사했습니다.');
  };
  const sw=$('#qrShareWrap');
  if(sw && navigator.share){
    sw.innerHTML='<button class="btn g sm" id="qrShare">이미지 공유</button>';
    $('#qrShare').onclick=shareQR;
  }
  const bm=$('#backMine'); if(bm) bm.onclick=()=>{ if(ro){ S=mine||S; ro=false; mine=null; roName=''; srvMsg=''; tab='guide'; render() } };

  on('[data-xe]','change',e=>{ const i=+e.target.dataset.xe, f=e.target.dataset.f;
    S.nextYear.extraExp[i][f] = f==='amt'? num(e.target.value) : e.target.value; save(); render() });
  on('[data-xi]','change',e=>{ const i=+e.target.dataset.xi, f=e.target.dataset.f;
    S.nextYear.extraInc[i][f] = f==='amt'? num(e.target.value) : e.target.value; save(); render() });
  on('[data-xe-del]','click',e=>{ S.nextYear.extraExp.splice(+e.target.dataset.xeDel,1); save(); render() });
  on('[data-xi-del]','click',e=>{ S.nextYear.extraInc.splice(+e.target.dataset.xiDel,1); save(); render() });
  if($('#addXE')) $('#addXE').onclick=()=>{ S.nextYear.extraExp.push({name:'',amt:0,basis:''}); save(); render() };
  if($('#addXI')) $('#addXI').onclick=()=>{ S.nextYear.extraInc.push({name:'',amt:0}); save(); render() };

  if($('#fSave')) $('#fSave').onclick=saveFile;
  if($('#fOpen')) $('#fOpen').onclick=()=>document.getElementById('myFile').click();
  if($('#libAdd')) $('#libAdd').onclick=()=>document.getElementById('deptFiles').click();
  if($('#libFolder')) $('#libFolder').onclick=readFolder;
  if($('#libClear')) $('#libClear').onclick=()=>{
    if(!confirm('읽어 둔 다른 부서 목록을 모두 지웁니다. 원본 파일은 그대로 남습니다. 계속할까요?')) return;
    LIB={}; saveLib(); srvMsg=''; render();
  };
  on('[data-lib-read]','click',e=>readDept(e.target.dataset.libRead));
  on('[data-lib-del]','click',e=>{ delete LIB[e.target.dataset.libDel.slice(5)]; saveLib(); render() });
  if($('#sSaveBtn')) $('#sSaveBtn').onclick=srvSave;
  if($('#sLoadBtn')) $('#sLoadBtn').onclick=srvLoad;
  if($('#xExcel')) $('#xExcel').onclick=exportExcel;
  if($('#newYear')) $('#newYear').onclick=()=>{
    if(!confirm(`${S.meta.year+1}년 장부를 새로 시작합니다. 현재 기록은 사라집니다. 백업하셨나요?`)) return;
    const s=settle(), y=S.meta.year+1;
    const baseInc=S.incomeItems.map(i=>({name:i.name,budget:+S.nextYear.income[i.name]||0}));
    const newInc=S.nextYear.extraInc.filter(x=>x.name.trim()).map(x=>({name:x.name.trim(),budget:x.amt}));
    const g=etcIndex(baseInc);
    const inc = g<0 ? baseInc.concat(newInc)
                    : baseInc.slice(0,g).concat(newInc, baseInc.slice(g));
    const exp=S.expenseItems.map(i=>({name:i.name,budget:+S.nextYear.expense[i.name]||0,basis:S.nextYear.basis[i.name]||''}))
      .concat(S.nextYear.extraExp.filter(x=>x.name.trim()).map(x=>({name:x.name.trim(),budget:x.amt,basis:x.basis})));
    S={meta:{year:y,dept:S.meta.dept,church:S.meta.church},openingBalance:s.q4,
       incomeItems:inc,expenseItems:exp,entries:{DEC:[],Q1:[],Q2:[],Q3:[],Q4:[]},
       nextYear:{expense:{},income:{},basis:{},extraExp:[],extraInc:[],dec:0,note:''}};
    save(); tab='guide'; per='DEC'; render();
  };
  if($('#wipe')) $('#wipe').onclick=()=>{
    if(!confirm('모든 기록을 지웁니다. 계속할까요?')) return;
    if(!confirm('정말 지울까요? 되돌릴 수 없습니다.')) return;
    S=norm(fresh()); save(); tab='guide'; render();
  };
}
function used(name){ return P.some(p=>ents(p.k).some(e=>e.cat===name)) }
function renameCat(oldN,newN){
  if(!oldN||!newN||oldN===newN) return;
  P.forEach(p=>ents(p.k).forEach(e=>{ if(e.cat===oldN) e.cat=newN }));
  ['expense','income','basis'].forEach(g=>{
    if(S.nextYear[g] && oldN in S.nextYear[g]){ S.nextYear[g][newN]=S.nextYear[g][oldN]; delete S.nextYear[g][oldN] }
  });
}
function dl(blob,name){
  const u=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=u; a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(u),2000);
}

/* ───────── 엑셀 내보내기 ───────── */
function loadXLSX(){
  return new Promise((res,rej)=>{
    if(window.XLSX) return res();
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload=res; s.onerror=rej; document.head.appendChild(s);
  });
}
async function exportExcel(){
  try{ await loadXLSX() }catch(e){ alert('인터넷 연결이 없어 엑셀 변환을 할 수 없습니다. 백업(.json) 파일을 대신 사용하세요.'); return }
  const s=settle(), wb=XLSX.utils.book_new(), A=(a,n)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(a),n);

  const b=[[`${S.meta.year}년 ${S.meta.dept} 운영계획`],[],['수입 항목','수입액','','지출 항목','지출액','산출근거']];
  const L=Math.max(S.incomeItems.length,S.expenseItems.length);
  for(let i=0;i<L;i++){
    const a=S.incomeItems[i], c=S.expenseItems[i];
    b.push([a?a.name:'',a?a.budget:'','',c?c.name:'',c?c.budget:'',c?c.basis:'']);
  }
  b.push(['계',S.incomeItems.reduce((t,i)=>t+i.budget,0),'','계',S.expenseItems.reduce((t,i)=>t+i.budget,0),'']);
  A(b,'예산');

  P.forEach(p=>{
    const a=[[`${S.meta.dept} ${p.d(S.meta.year)} 수입 및 지출 내역`],[],['관','항','날짜','금액','산출근거','잔액']];
    let bal=opening(p.k);
    a.push(['',p.k==='DEC'?`${S.meta.year-1}년 11월 이월금`:'전 분기 잔고','',bal,'',bal]);
    sorted(p.k).forEach(e=>{ bal+=sgn(e); a.push([e.type,e.cat,e.date,sgn(e),e.note,bal]) });
    a.push([`${p.label} 잔고`,'','',net(p.k),'',closing(p.k)]);
    a.push([],['항목별 소계'],['구분','항목','소계','누계']);
    S.incomeItems.slice(1).forEach(i=>a.push(['수입',i.name,catAmt(p.k,i.name,false),p.k==='DEC'?'':cumAmt(p.k,i.name,false)]));
    S.expenseItems.forEach(i=>a.push(['지출',i.name,catAmt(p.k,i.name,true),p.k==='DEC'?'':cumAmt(p.k,i.name,true)]));
    A(a,p.label);
  });

  const c=[[`${S.meta.year}년 ${S.meta.dept} 결산 보고서`],[],
    ['수입 항목','예산','수입','','지출 항목','예산','지출','증감']];
  const M=Math.max(s.inc.length,s.exp.length);
  for(let i=0;i<M;i++){
    const x=s.inc[i], y=s.exp[i];
    c.push([x?x.name:'',x?x.budget:'',x?x.actual:'','',y?y.name:'',y?y.budget:'',y?y.actual:'',y?y.actual-y.budget:'']);
  }
  c.push(['소계',s.incB,s.incT,'','소계',s.expB,s.expT,s.expT-s.expB],[],
    ['수입 합계',s.incT],['지출 합계',s.expT],['12월 가결산',s.dec],['이월금',s.incT-s.expT-s.dec]);
  A(c,'결산');

  const n=[[`${S.meta.year+1}년 ${S.meta.dept} 예산 요구(안)`],[],
    ['지출 항목',`${S.meta.year}년 결산`,`${S.meta.year+1}년 예산`,'증감','산출내역']];
  S.expenseItems.forEach((it,i)=>{const v=+S.nextYear.expense[it.name]||0;
    n.push([it.name,s.exp[i].actual,v,v-s.exp[i].actual,S.nextYear.basis[it.name]||''])});
  S.nextYear.extraExp.filter(x=>x.name.trim()).forEach(x=>n.push([x.name,0,x.amt,x.amt,x.basis]));
  n.push(['12월 가결산',s.dec,'','',''],
    ['총계',s.expT+s.dec,S.expenseItems.reduce((t,i)=>t+(+S.nextYear.expense[i.name]||0),0)+S.nextYear.extraExp.reduce((t,x)=>t+x.amt,0)],[],
    ['수입 항목',`${S.meta.year}년 결산`,`${S.meta.year+1}년 예산`,'증감']);
  S.incomeItems.forEach((it,i)=>{const v=+S.nextYear.income[it.name]||0;
    n.push([it.name,s.inc[i].actual,v,v-s.inc[i].actual])});
  S.nextYear.extraInc.filter(x=>x.name.trim()).forEach(x=>n.push([x.name,0,x.amt,x.amt]));
  n.push(['총계',s.incT,S.incomeItems.reduce((t,i)=>t+(+S.nextYear.income[i.name]||0),0)+S.nextYear.extraInc.reduce((t,x)=>t+x.amt,0)],[],
    ['증감 요인 / 협의 내용'],[S.nextYear.note||'']);
  A(n,'새해예산요구');

  XLSX.writeFile(wb, `${S.meta.year}년_${S.meta.dept||'부서'}_회계장부.xlsx`);
}
